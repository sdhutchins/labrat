[build-system]
requires = ["setuptools >= 77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pylabrat"
version = "0.1"
description = """
A Python framework designed to improve reproducibility, simplify laboratory \
management, and support common biomedical research tasks."""
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Shaurita Hutchins", email = "shaurita.d.hutchins@gmail.com"}
]
keywords = ["science", "lab", "genetics", "math", "filemanagement"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Unix",
    "Natural Language :: English",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "cookiecutter>=1.5.1",
    "logzero>=1.3.1",
    "exmemo>=0.1.0",
    "click>=6.7",
    "jinja2-time>=0.2.0",
    "mygene>=3.2.2",
    "myvariant>=1.0.0",
    "rich>=14.1.0",
]

[project.optional-dependencies]
docs = [
    "great-docs>=0.17,<0.18",
]

[project.urls]
Homepage = "https://github.com/sdhutchins/labrat"
Documentation = "https://www.shauritahutchins.com/labrat/"
Releases = "https://github.com/sdhutchins/labrat/releases"
Issues = "https://github.com/sdhutchins/labrat/issues"

[project.scripts]
labrat = "labrat.cli:main"

[tool.setuptools]
packages = {find = {}}
include-package-data = true
zip-safe = false

[tool.setuptools.package-data]
"labrat.genetics" = ["codons.json"]
