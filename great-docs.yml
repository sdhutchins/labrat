# API Reference Structure
# -----------------------
# Customize the sections below to organize your API documentation.
# - Reorder items within a section to change their display order
# - Move items between sections or create new sections
# - Use 'members: false' to exclude methods from documentation
# - Add 'desc:' to sections for descriptions

reference:
  - title: Classes
    desc: Main classes provided by the package
    contents:
      - filemanager.Archiver  # 2 method(s)
      - name: filemanager.FileOrganizer
        members: false  # 8 methods listed below
      - name: project.ProjectManager
        members: false  # 7 methods listed below

  - title: filemanager.FileOrganizer Methods
    desc: Methods for the filemanager.FileOrganizer class
    contents:
      - filemanager.FileOrganizer.move_file
      - filemanager.FileOrganizer.organize_by_year
      - filemanager.FileOrganizer.organize_documents
      - filemanager.FileOrganizer.organize_archives
      - filemanager.FileOrganizer.organize_files
      - filemanager.FileOrganizer.move_specific_files
      - filemanager.FileOrganizer.organize_science_files
      - filemanager.FileOrganizer.organize_all

  - title: project.ProjectManager Methods
    desc: Methods for the project.ProjectManager class
    contents:
      - project.ProjectManager.new_project
      - project.ProjectManager.list_projects
      - project.ProjectManager.update_project
      - project.ProjectManager.list_project_files
      - project.ProjectManager.archive_project
      - project.ProjectManager.add_template
      - project.ProjectManager.delete_project

  - title: Functions
    desc: Utility functions
    contents:
      - math.calculate_molarity
      - math.dilute_stock
      - math.refractive_index_prism
      - math.transmittance_to_absorbance

  - title: Other
    desc: Additional exports
    contents:
      - genetics
      - graphpad
      - guis
      - notebook

# Site Settings
# -------------
# site:
#   theme: flatly              # Quarto theme (default: flatly)
#   toc: true                  # Show table of contents (default: true)
#   toc-depth: 2               # TOC heading depth (default: 2)
#   toc-title: On this page    # TOC title (default: "On this page")

# Jupyter Kernel
# --------------
# Jupyter kernel to use for executing code cells in .qmd files.
# This is set at the project level so it applies to all pages, including
# auto-generated API reference pages. Can be overridden in individual .qmd
# file frontmatter if needed for special cases.
jupyter: python3

# CLI Documentation
# -----------------
# cli:
#   enabled: true              # Enable CLI documentation
#   module: my_package.cli     # Module containing Click commands
#   name: cli                  # Name of the Click command object
